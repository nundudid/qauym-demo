# Dataset provenance register (DR-07). Benchmark data never enters the app database.
# `python -m bench data` (make data) downloads each file into data/raw/ and verifies
# its SHA-256. If the network blocks the download, place the files there by hand.
datasets:
  - name: email-Eu-core
    description: >-
      E-mail network of a large European research institution. Nodes are members,
      an edge (u, v) means u sent at least one e-mail to v. Ground truth is each
      member's department (42 departments).
    source_page: https://snap.stanford.edu/data/email-Eu-core.html
    terms_of_use: >-
      Stanford Large Network Dataset Collection (SNAP), published for research use;
      cite the papers below. The data is anonymised by its publishers.
    citation:
      - >-
        Hao Yin, Austin R. Benson, Jure Leskovec, David F. Gleich. "Local Higher-order
        Graph Clustering." KDD 2017.
      - >-
        J. Leskovec, J. Kleinberg, C. Faloutsos. "Graph Evolution: Densification and
        Shrinking Diameters." ACM TKDD 1(1), 2007.
    preprocessing:
      - Read the directed edge list (1,005 nodes, 25,571 edges).
      - Drop self-loops.
      - Convert to undirected and merge reciprocal edges into one.
      - Use the department label of each node as its ground-truth community.
    files:
      - filename: email-Eu-core.txt.gz
        url: https://snap.stanford.edu/data/email-Eu-core.txt.gz
        sha256: 4b47acdb80197b085fe63c819c357ae488131ee904ed93d1b219a68b0f9e245f
      - filename: email-Eu-core-department-labels.txt.gz
        url: https://snap.stanford.edu/data/email-Eu-core-department-labels.txt.gz
        sha256: e5abe5b4581a480032a63adcf2576c161785f45692642c6ebb0b1276f0f33669

  - name: lfr
    description: >-
      Lancichinetti-Fortunato-Radicchi synthetic benchmark graphs with planted
      communities. Generated locally; nothing is downloaded.
    source_page: https://networkx.org/documentation/stable/reference/generated/networkx.generators.community.LFR_benchmark_graph.html
    terms_of_use: Generated by networkx (BSD-3-Clause); no third-party data.
    citation:
      - >-
        A. Lancichinetti, S. Fortunato, F. Radicchi. "Benchmark graphs for testing
        community detection algorithms." Physical Review E 78, 046110, 2008.
    preprocessing:
      - Generate with networkx.LFR_benchmark_graph and the parameters in bench/configs.
      - If the generator does not converge, retry with seed + 1 (up to 10 times) and record the seed used.
      - Drop self-loops; ground truth is the node attribute `community`.
    files: []
