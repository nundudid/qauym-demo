# M0 benchmark (SPEC Section 7): Leiden and Louvain on LFR and SNAP email-Eu-core.
seeds: [1, 2, 3, 4, 5]
methods: [leiden, louvain]
datasets:
  - name: LFR mu=0.1
    kind: lfr
    params: &lfr {n: 1000, tau1: 3, tau2: 1.5, mu: 0.1, average_degree: 15, max_degree: 50, min_community: 20, max_community: 100, seed: 42}
  - name: LFR mu=0.3
    kind: lfr
    params: {<<: *lfr, mu: 0.3}
  - name: LFR mu=0.5
    kind: lfr
    params: {<<: *lfr, mu: 0.5}
  - name: email-Eu-core
    kind: email_eu_core
