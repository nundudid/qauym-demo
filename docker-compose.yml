services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qauym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qauym}
      POSTGRES_DB: ${POSTGRES_DB:-qauym}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      GIT_SHA: ${GIT_SHA:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qauym}:${POSTGRES_PASSWORD:-qauym}@db:5432/${POSTGRES_DB:-qauym}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qauym}:${POSTGRES_PASSWORD:-qauym}@db:5432/${POSTGRES_DB:-qauym}_test
      VALKEY_URL: redis://valkey:6379/0
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      MPLBACKEND: Agg
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./evidence:/evidence
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - ./evidence:/evidence
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

  # Playwright runner; started only by `make e2e` and `make evidence`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["e2e"]
    working_dir: /app
    environment:
      E2E_BASE_URL: http://web:5173
      CI: "1"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - ./evidence:/evidence
    depends_on:
      - web
    command: npx playwright test

volumes:
  pgdata:
  web_node_modules:
